<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Snapdrop — QR edge states (in-language)</title>
<style>
  :root{
    --base:#142C1D;--green:#3BA873;--soft:#8fd9b0;--ink:#fff;--muted:#9BA39E;--pill-ink:#0E1A12;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:Georgia,"Times New Roman",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0C0D0E;color:#cfd3d1;font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 18px;gap:18px}
  .label{font-family:var(--serif);font-style:italic;color:#8a908d;font-size:.95rem;text-align:center}
  .row{display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
  .col{display:flex;flex-direction:column;align-items:center;gap:11px}
  .sub{font-size:.78rem;color:#7c827f;letter-spacing:.3px;text-transform:uppercase}

  .phone{position:relative;width:306px;height:664px;border-radius:42px;overflow:hidden;background-color:var(--base);
    box-shadow:0 26px 60px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.06)}
  .phone::before{content:'';position:absolute;inset:0;z-index:0;
    background:radial-gradient(118% 88% at 25% -6%, rgba(44,153,103,.55) 0%, rgba(20,44,29,0) 56%),
              linear-gradient(180deg, rgba(0,0,0,0) 0%, #000 100%);}
  .screen{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:12px 20px 0}

  .sb{display:flex;justify-content:space-between;align-items:center;height:26px;color:#fff;font-size:.7rem;font-weight:600}
  .nav{display:flex;align-items:center;justify-content:center;height:40px}
  .wm{font-family:var(--serif);font-style:italic;font-size:1.16rem;color:#fff}

  .title{font-size:1.82rem;line-height:1.13;font-weight:800;color:#fff;letter-spacing:-.015em;text-align:center;margin-top:18px}
  .scanlabel{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;color:#e7eae8;font-size:.88rem;font-weight:500}
  .scanlabel.dim{color:#7c827f}

  .viewport{position:relative;width:196px;height:196px;margin:20px auto 0;border-radius:22px;overflow:hidden;
    background:linear-gradient(150deg,#1b2c22,#0e1612);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07), inset 0 12px 40px rgba(0,0,0,.45)}
  .viewport.expired{background:linear-gradient(150deg,#141d18,#0c110e)}
  .corner{position:absolute;width:28px;height:28px;border:2.5px solid rgba(255,255,255,.5);border-radius:4px}
  .viewport.expired .corner{border-color:rgba(255,255,255,.18)}
  .corner.tl{top:15px;left:15px;border-right:none;border-bottom:none}
  .corner.tr{top:15px;right:15px;border-left:none;border-bottom:none}
  .corner.bl{bottom:15px;left:15px;border-right:none;border-top:none}
  .corner.br{bottom:15px;right:15px;border-left:none;border-top:none}
  .scan{position:absolute;left:16px;right:16px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,rgba(94,210,150,.85),transparent);box-shadow:0 0 10px rgba(94,210,150,.6);animation:sweep 2.6s ease-in-out infinite}
  @keyframes sweep{0%{top:22px}50%{top:172px}100%{top:22px}}
  .vcenter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}

  .vmsg{text-align:center;margin-top:18px;color:#9BA39E;font-size:.85rem}

  .actwrap{display:flex;justify-content:center;margin-top:18px}
  .restart{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:#fff;color:var(--pill-ink);
    font-weight:700;font-size:.94rem;padding:13px 0;border-radius:999px;width:220px}
  .connect{display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.13);color:rgba(255,255,255,.5);
    font-weight:700;font-size:.94rem;padding:13px 0;border-radius:999px;width:220px}

  .toast{position:absolute;left:20px;right:20px;bottom:80px;z-index:2;display:flex;align-items:center;gap:10px;
    background:#222e27;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:13px 15px;
    color:#e9ece9;font-size:.85rem;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.45)}
  .home{height:5px;width:118px;border-radius:3px;background:rgba(255,255,255,.5);margin:auto auto 8px}
  .spacer{margin-top:auto}
</style>
</head>
<body>
<div class="label">QR edge states — quiet recovery, no red, no alarm</div>
<div class="row">

  <!-- TIMED OUT -->
  <div class="col">
    <div class="phone"><div class="screen">
      <div class="sb"><span>11:27</span><span>5G</span></div>
      <div class="nav"><span class="wm">Snapdrop</span></div>
      <div class="title">Select a plugin<br>to continue</div>
      <div class="scanlabel dim">Scan timed out</div>
      <div class="viewport expired">
        <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
        <div class="vcenter"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.34)" stroke-width="1.6"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/></svg></div>
      </div>
      <div class="vmsg">No QR code scanned — it may have expired.</div>
      <div class="actwrap"><span class="restart">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/></svg>Restart Scan</span></div>
      <div class="spacer"></div>
      <div class="home"></div>
    </div></div>
    <div class="sub">Timed out</div>
  </div>

  <!-- NO INTERNET -->
  <div class="col">
    <div class="phone">
      <div class="toast">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--soft)" stroke-width="1.8"><path d="M1 1l22 22M16.7 11.3A6 6 0 0 0 12 9M5 12.5a10 10 0 0 1 4-2.3M8.5 16a4 4 0 0 1 5 0M12 20h.01"/></svg>
        No internet connection
      </div>
      <div class="screen">
        <div class="sb"><span>11:27</span><span>5G</span></div>
        <div class="nav"><span class="wm">Snapdrop</span></div>
        <div class="title">Select a plugin<br>to continue</div>
        <div class="scanlabel">
          <svg width="13" height="19" viewBox="0 0 38 57" aria-hidden="true">
            <path d="M0 9.5A9.5 9.5 0 0 1 9.5 0H19v19H9.5A9.5 9.5 0 0 1 0 9.5z" fill="#F24E1E"/><path d="M19 0h9.5a9.5 9.5 0 1 1 0 19H19V0z" fill="#A259FF"/><path d="M0 28.5A9.5 9.5 0 0 1 9.5 19H19v19H9.5A9.5 9.5 0 0 1 0 28.5z" fill="#FF7262"/><path d="M28.5 19a9.5 9.5 0 1 1 0 19 9.5 9.5 0 0 1 0-19z" fill="#1ABCFE"/><path d="M0 47.5A9.5 9.5 0 0 1 9.5 38H19v9.5a9.5 9.5 0 1 1-19 0z" fill="#0ACF83"/></svg>
          Scan QR Code to connect
        </div>
        <div class="viewport">
          <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
          <span class="scan"></span>
        </div>
        <div class="actwrap"><span class="connect">Connect</span></div>
        <div class="spacer"></div>
        <div class="home"></div>
      </div>
    </div>
    <div class="sub">No internet</div>
  </div>

</div>
</body>
</html>
