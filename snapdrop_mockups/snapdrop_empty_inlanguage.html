<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Snapdrop — Empty state (in-language)</title>
<style>
  :root{
    --base:#142C1D;--green:#3BA873;--soft:#8fd9b0;--ink:#fff;--muted:#9BA39E;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:Georgia,"Times New Roman",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0C0D0E;color:#cfd3d1;font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;gap:20px}
  .label{font-family:var(--serif);font-style:italic;color:#8a908d;font-size:.95rem;text-align:center}

  .phone{position:relative;width:344px;height:746px;border-radius:46px;overflow:hidden;background-color:var(--base);
    box-shadow:0 30px 70px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.06)}
  .phone::before{content:'';position:absolute;inset:0;z-index:0;
    background:radial-gradient(118% 88% at 25% -6%, rgba(44,153,103,.55) 0%, rgba(20,44,29,0) 56%),
              linear-gradient(180deg, rgba(0,0,0,0) 0%, #000 100%);}
  .screen{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:13px 22px 0}

  .sb{display:flex;justify-content:space-between;align-items:center;height:28px;color:#fff;font-size:.74rem;font-weight:600}
  .nav{display:flex;align-items:center;justify-content:center;height:42px;margin-top:2px}
  .wm{font-family:var(--serif);font-style:italic;font-size:1.24rem;color:#fff}

  .title{font-size:2rem;line-height:1.1;font-weight:800;color:#fff;letter-spacing:-.015em;margin-top:14px}
  .subtitle{color:var(--muted);font-size:.92rem;margin-top:8px}
  .rule{height:1px;background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,255,255,.03));margin:14px 0 16px;border-radius:1px}

  .albumrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
  .albumrow .name{display:flex;align-items:center;gap:7px;color:#fff;font-weight:600;font-size:.96rem}
  .albumrow .all{color:var(--green);font-weight:600;font-size:.88rem}

  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-bottom:60px}
  .emptyic{width:84px;height:84px;border-radius:24px;display:flex;align-items:center;justify-content:center;
    background:rgba(59,168,115,.08);border:1px solid rgba(255,255,255,.07)}
  .emptytext{text-align:center}
  .emptytext .h{color:#e9ece9;font-size:1.05rem;font-weight:600}
  .emptytext .p{color:var(--muted);font-size:.88rem;margin-top:7px;max-width:220px;line-height:1.4}
  .home{height:5px;width:128px;border-radius:3px;background:rgba(255,255,255,.5);margin:0 auto 9px}
</style>
</head>
<body>
<div class="label">Empty state — header + album switcher stay in place · quiet, no Lottie</div>
<div class="phone"><div class="screen">

  <div class="sb"><span>11:27</span>
    <span><svg width="50" height="12" viewBox="0 0 50 12" fill="#fff">
      <rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.5" y="5.5" width="3" height="6.5" rx="1"/><rect x="9" y="3" width="3" height="9" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/>
      <path d="M22 4.2C24.4 1.9 27 1 29.8 1S35.2 1.9 37.6 4.2" stroke="#fff" stroke-width="1.2" fill="none" stroke-linecap="round"/><path d="M24.6 6.6C26 5.4 27.8 4.8 29.8 4.8s3.8.6 5.2 1.8" stroke="#fff" stroke-width="1.2" fill="none" stroke-linecap="round"/><circle cx="29.8" cy="9.4" r="1.3"/>
      <rect x="42" y="1.5" width="6.4" height="9" rx="2.2" stroke="#fff" stroke-opacity=".5" fill="none"/><rect x="43.2" y="3" width="4" height="6" rx="1"/></svg></span>
  </div>

  <div class="nav"><span class="wm">Snapdrop</span></div>

  <div class="title">Select Images<br>to continue</div>
  <div class="subtitle">Upto 10 images</div>
  <div class="rule"></div>

  <div class="albumrow">
    <span class="name">Screenshots
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></span>
    <span class="all">View all</span>
  </div>

  <div class="empty">
    <div class="emptyic">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--soft)" stroke-width="1.5" stroke-opacity=".7"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.7"/><path d="M21 15l-5-5L5 21"/></svg>
    </div>
    <div class="emptytext">
      <div class="h">No images here yet</div>
      <div class="p">Photos in this album will appear here. Try another album above.</div>
    </div>
  </div>

  <div class="home"></div>

</div></div>
</body>
</html>
