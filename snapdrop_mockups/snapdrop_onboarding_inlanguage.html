<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Snapdrop — Onboarding (in-language)</title>
<style>
  :root{
    --base:#142C1D;--green:#3BA873;--soft:#8fd9b0;--ink:#fff;--muted:#9BA39E;--pill-ink:#0E1A12;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:Georgia,"Times New Roman",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0C0D0E;color:#cfd3d1;font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;gap:20px}
  .label{font-family:var(--serif);font-style:italic;color:#8a908d;font-size:.95rem;text-align:center}

  .phone{position:relative;width:344px;height:746px;border-radius:46px;overflow:hidden;background-color:var(--base);
    box-shadow:0 30px 70px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.06)}
  .phone::before{content:'';position:absolute;inset:0;z-index:0;
    background:radial-gradient(118% 88% at 25% -6%, rgba(44,153,103,.55) 0%, rgba(20,44,29,0) 56%),
              linear-gradient(180deg, rgba(0,0,0,0) 0%, #000 100%);}
  .screen{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:13px 26px 0}

  .sb{display:flex;justify-content:space-between;align-items:center;height:28px;color:#fff;font-size:.74rem;font-weight:600}
  .nav{display:flex;align-items:center;justify-content:center;height:42px;margin-top:2px}
  .wm{font-family:var(--serif);font-style:italic;font-size:1.24rem;color:#fff}

  .head{text-align:center;margin-top:30px}
  .title{font-size:1.95rem;line-height:1.12;font-weight:800;color:#fff;letter-spacing:-.015em}
  .subline{color:var(--muted);font-size:.95rem;margin-top:10px}

  .beats{margin-top:40px;display:flex;flex-direction:column;gap:22px}
  .beat{display:flex;align-items:center;gap:15px}
  .ic{flex:0 0 auto;width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
    background:rgba(59,168,115,.12);border:1px solid rgba(255,255,255,.09)}
  .beat .txt{color:#eef1ef;font-size:.96rem;line-height:1.35;font-weight:500}

  .bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:18px;padding-bottom:0}
  .lang{display:inline-flex;align-items:center;gap:8px;color:#cfd6d2;font-size:.85rem;font-weight:600;
    padding:9px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04)}
  .cta{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:#fff;color:var(--pill-ink);
    font-weight:700;font-size:1rem;padding:15px 0;border-radius:999px;width:260px}
  .home{height:5px;width:128px;border-radius:3px;background:rgba(255,255,255,.5);margin:16px auto 9px}
</style>
</head>
<body>
<div class="label">Onboarding — designed in your language (no Figma reference) · no stepper</div>
<div class="phone"><div class="screen">

  <div class="sb"><span>11:27</span>
    <span><svg width="50" height="12" viewBox="0 0 50 12" fill="#fff">
      <rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.5" y="5.5" width="3" height="6.5" rx="1"/><rect x="9" y="3" width="3" height="9" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/>
      <path d="M22 4.2C24.4 1.9 27 1 29.8 1S35.2 1.9 37.6 4.2" stroke="#fff" stroke-width="1.2" fill="none" stroke-linecap="round"/><path d="M24.6 6.6C26 5.4 27.8 4.8 29.8 4.8s3.8.6 5.2 1.8" stroke="#fff" stroke-width="1.2" fill="none" stroke-linecap="round"/><circle cx="29.8" cy="9.4" r="1.3"/>
      <rect x="42" y="1.5" width="6.4" height="9" rx="2.2" stroke="#fff" stroke-opacity=".5" fill="none"/><rect x="43.2" y="3" width="4" height="6" rx="1"/></svg></span>
  </div>

  <div class="nav"><span class="wm">Snapdrop</span></div>

  <div class="head">
    <div class="title">Send images<br>straight to Figma</div>
    <div class="subline">Phone to canvas, in seconds.</div>
  </div>

  <div class="beats">
    <div class="beat">
      <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--soft)" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg></span>
      <span class="txt">Pick up to 10 images from your phone</span>
    </div>
    <div class="beat">
      <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--soft)" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3M21 14v0M17 21h4M21 17v4"/></svg></span>
      <span class="txt">Scan the QR in your Figma plugin</span>
    </div>
    <div class="beat">
      <span class="ic"><svg width="17" height="25" viewBox="0 0 38 57" aria-hidden="true">
        <path d="M0 9.5A9.5 9.5 0 0 1 9.5 0H19v19H9.5A9.5 9.5 0 0 1 0 9.5z" fill="#F24E1E"/>
        <path d="M19 0h9.5a9.5 9.5 0 1 1 0 19H19V0z" fill="#A259FF"/>
        <path d="M0 28.5A9.5 9.5 0 0 1 9.5 19H19v19H9.5A9.5 9.5 0 0 1 0 28.5z" fill="#FF7262"/>
        <path d="M28.5 19a9.5 9.5 0 1 1 0 19 9.5 9.5 0 0 1 0-19z" fill="#1ABCFE"/>
        <path d="M0 47.5A9.5 9.5 0 0 1 9.5 38H19v9.5a9.5 9.5 0 1 1-19 0z" fill="#0ACF83"/></svg></span>
      <span class="txt">They land straight on your canvas</span>
    </div>
  </div>

  <div class="bottom">
    <span class="lang">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15.5 0 18M12 3c-2.5 2.5-2.5 15.5 0 18"/></svg>
      English
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </span>
    <span class="cta">Get Started
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </span>
  </div>
  <div class="home"></div>

</div></div>
</body>
</html>
